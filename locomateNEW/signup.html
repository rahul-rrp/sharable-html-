<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-signup">
  <main class="screen" aria-label="Sign up screen">
    <section class="hero">
      <div class="status">
        <span>9:41</span>
        <div class="system-icons" aria-hidden="true">
          <div class="signal"><span></span><span></span><span></span><span></span></div>
          <div class="wifi"></div>
          <div class="battery"></div>
        </div>
      </div>

      <button class="skip" type="button">SKIP</button>

      <div class="hero-copy">
        <h1>CREATE YOUR <span>PROFILE</span></h1>
        <p>Let’s get to know you better</p>
      </div>

      <img class="pin-art" src="UIUX/extra/login page header .png" alt="" />

      <div class="tabs" role="tablist" aria-label="Authentication mode">
        <a class="tab active" href="signup.html" role="tab" aria-selected="true">SIGN UP</a>
        <a class="tab" href="login.html" role="tab">LOGIN</a>
      </div>
    </section>

    <section class="panel">
      <div class="input-box">
        <img class="field-icon" src="UIUX/icons/full-name.png" alt="" />
        <label class="input-copy" for="full-name">
          <span>FULL NAME</span>
          <input id="full-name" type="text" placeholder="Enter your full name" />
        </label>
      </div>

      <div class="section-row">
        <h2 class="section-title">CHOOSE AVATAR</h2>
        <button class="see-all" type="button">See All ›</button>
      </div>

      <div class="avatars" aria-label="Choose avatar">
        <button class="avatar active" type="button" aria-label="Avatar 1"><img src="UIUX/avatar/avatar1.png" alt="" /></button>
        <button class="avatar" type="button" aria-label="Avatar 2"><img src="UIUX/avatar/avatar2.png" alt="" /></button>
        <button class="avatar" type="button" aria-label="Avatar 3"><img src="UIUX/avatar/avatar3.png" alt="" /></button>
        <button class="avatar" type="button" aria-label="Avatar 4"><img src="UIUX/avatar/avatar4.png" alt="" /></button>
        <button class="avatar" type="button" aria-label="Avatar 5"><img src="UIUX/avatar/AI .png" alt="" /></button>
      </div>

      <h2 class="section-title field-label">GENDER</h2>
      <div class="gender">
        <button class="selected" type="button"><span class="gender-icon">♂</span>Male</button>
        <button type="button"><span class="gender-icon">♀</span>Female</button>
        <button type="button"><span class="gender-icon">⚥</span>Others</button>
      </div>

      <h2 class="section-title field-label">DATE OF BIRTH</h2>
      <div class="dob">
        <div class="dob-cell"><img class="date-icon" src="UIUX/icons/date-of-birth.png" alt="" /></div>
        <div class="dob-cell">Jan <span class="chevron"></span></div>
        <div class="dob-cell">15 <span class="chevron"></span></div>
        <div class="dob-cell">2004 <span class="chevron"></span></div>
      </div>

      <label class="field-label" for="phone">PHONE NUMBER</label>
      <div class="phone-field">
        <div class="country">
          <span class="flag" aria-hidden="true">🇮🇳</span>
          <span>+91</span>
          <span class="chevron" aria-hidden="true"></span>
        </div>
        <input id="phone" inputmode="tel" type="tel" placeholder="Enter phone number" />
      </div>

      <button class="otp" type="button">Send OTP</button>

      <p class="terms">
        By continuing, you agree to our<br />
        <a href="#">Terms &amp; Conditions</a>
        &nbsp; • &nbsp;
        <a href="#">Privacy Policy</a>
      </p>

      <div class="city" aria-hidden="true"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
